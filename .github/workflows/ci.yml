name: Node.js tests

on:
  push:
    branches:
      - s2s-local-work
      - feat/cm-tron-crypto-ids
  pull_request:
    branches:
      - s2s-local-work

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run test suite
        run: npm test
