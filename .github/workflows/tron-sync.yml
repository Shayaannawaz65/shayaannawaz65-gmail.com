name: TRON USDT Sync

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    if: vars.T2T_TRON_SCHEDULER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Authenticate and request TRON sync
        uses: actions/github-script@v7
        env:
          T2T_TRON_SYNC_TOKEN: ${{ secrets.T2T_TRON_SYNC_TOKEN }}
        with:
          script: |
            const syncToken = process.env.T2T_TRON_SYNC_TOKEN;
            if (!syncToken) {
              core.setFailed("Required sync secret is not configured.");
              return;
            }

            const oidcToken = await core.getIDToken();
            const response = await fetch(
              "https://t2t-nowpayments.vercel.app/api/tron/sync",
              {
                method: "POST",
                headers: {
                  "x-vercel-trusted-oidc-idp-token": oidcToken,
                  "Authorization": `Bearer ${syncToken}`,
                  "Content-Type": "application/json"
                },
                body: "{}"
              }
            );

            core.info(`TRON sync endpoint HTTP status: ${response.status}`);
            if (!response.ok) {
              core.setFailed(`TRON sync request failed with HTTP ${response.status}.`);
            }
