name: TRON USDT Sync

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || vars.T2T_TRON_SCHEDULER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Authenticate and request TRON sync
        uses: actions/github-script@v7
        env:
          T2T_TRON_SYNC_TOKEN: ${{ secrets.T2T_TRON_SYNC_TOKEN }}
          T2T_TRON_SYNC_URL: ${{ vars.T2T_TRON_SYNC_URL }}
        with:
          script: |
            const syncToken = process.env.T2T_TRON_SYNC_TOKEN;
            if (!syncToken) {
              core.setFailed("Required sync secret is not configured.");
              return;
            }

            const syncUrl = process.env.T2T_TRON_SYNC_URL;
            if (!syncUrl) {
              core.setFailed("Required T2T_TRON_SYNC_URL repository variable is not configured.");
              return;
            }
            let parsedUrl;
            try {
              parsedUrl = new URL(syncUrl);
            } catch {
              core.setFailed("T2T_TRON_SYNC_URL must be a valid HTTPS URL.");
              return;
            }
            if (parsedUrl.protocol !== "https:" || parsedUrl.pathname !== "/api/tron/sync") {
              core.setFailed("T2T_TRON_SYNC_URL must be HTTPS and end with /api/tron/sync.");
              return;
            }

            const oidcToken = await core.getIDToken();
            const response = await fetch(
              parsedUrl.toString(),
              {
                method: "POST",
                headers: {
                  "x-vercel-trusted-oidc-idp-token": oidcToken,
                  "Authorization": `Bearer ${syncToken}`,
                  "Content-Type": "application/json"
                },
                body: "{}"
              }
            );

            core.info(`TRON sync endpoint HTTP status: ${response.status}`);
            const responseText = await response.text();
            try {
              const result = JSON.parse(responseText);
              const safeResult = Object.fromEntries(
                ["scan_complete", "retry_required", "completed_windows",
                 "pages_read", "events_seen", "new_events",
                 "invalid_events_skipped", "cursor", "message", "error"]
                  .filter((key) => key in result)
                  .map((key) => [key, result[key]])
              );
              core.info(`TRON sync result: ${JSON.stringify(safeResult)}`);
            } catch {
              core.info("TRON sync response was not JSON; body omitted.");
            }
            if (!response.ok) {
              core.setFailed(`TRON sync request failed with HTTP ${response.status}.`);
            }
